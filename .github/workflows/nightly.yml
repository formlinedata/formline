name: Nightly data update

on:
  schedule:
    - cron: '17 6 * * *'   # full run: 06:17 UTC every day (02:17 in Toronto during daylight time)
    - cron: '47 * * * *'   # light run, every hour: does nothing unless a national-team match is on within a day
  workflow_dispatch:        # "Run workflow" button on the Actions tab (always a full run)

permissions:
  contents: write

concurrency:
  group: nightly-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUN_MODE: ${{ github.event.schedule == '47 * * * *' && 'light' || 'full' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test the build scripts
        run: node build/test.mjs
      - name: Build data
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          API_BUDGET: ${{ vars.API_BUDGET || '80' }}
        run: node build/update.mjs
      - name: Share image with today's top five
        if: env.RUN_MODE == 'full'
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
          node build/og.mjs
      - name: Point link previews at this site's address
        run: node build/site-url.mjs
      - name: Static team pages and sitemap
        run: node build/pages.mjs
      - name: Save the Wikipedia images the site falls back on
        if: env.RUN_MODE == 'full'
        continue-on-error: true
        run: node build/wiki-images.mjs
      - name: Local copies of the chart library and font
        if: env.RUN_MODE == 'full'
        continue-on-error: true
        run: node build/vendor.mjs
      - name: List bundled badges
        if: env.RUN_MODE == 'full'
        run: node build/badges.mjs
      - name: Commit changed data
        run: |
          git config user.name "formline-bot"
          git config user.email "formline-bot@users.noreply.github.com"
          git add data build/store og.png apple-touch-icon.png index.html teams badges
          git add sitemap.xml robots.txt 2>/dev/null || true
          git add vendor 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git diff --cached --name-only > "$RUNNER_TEMP/changed.txt"
            if [ "$RUN_MODE" = "light" ]; then git commit -m "Match-day data $(date -u +'%Y-%m-%d %H:%M')"; else git commit -m "Nightly data $(date -u +%Y-%m-%d)"; fi
            git pull --rebase
            git push
          fi
      - name: Tell Bing which pages changed (IndexNow)
        continue-on-error: true
        timeout-minutes: 16
        run: |
          if [ -f "$RUNNER_TEMP/changed.txt" ]; then CHANGED_FILES="$RUNNER_TEMP/changed.txt" node build/indexnow.mjs; else echo "Nothing committed."; fi
