name: Daily social post
# Morning: make today's post (build/social.mjs), keep it on the social-queue branch, and open a review issue with the
# Instagram slides, the caption and an X version to post by hand. Evening: post it to Bluesky and Instagram unless the
# issue was closed (build/social-publish.mjs). Times are UTC: 13:23 is 8:23 am in Toronto in winter, 23:07 is 6:07 pm.
on:
  schedule:
    - cron: '23 13 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:
    inputs:
      step:
        description: 'prepare = make the post and open the issue; publish = post it to Instagram now'
        type: choice
        options: [prepare, publish]
        default: prepare
      type:
        description: 'Kind of post (blank = the usual for the day): match, spotlight, onThisDay, rivalry, tournament, pastTournament, rankings'
        required: false
        default: ''
permissions:
  contents: write
  issues: write
concurrency: social

jobs:
  prepare:
    if: (github.event_name == 'schedule' && github.event.schedule == '23 13 * * *') || (github.event_name == 'workflow_dispatch' && inputs.step == 'prepare')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch the post queue
        run: |
          mkdir -p "$RUNNER_TEMP/q"
          if git fetch -q --depth=1 origin social-queue; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/q"; else echo "No queue yet."; fi
          echo "SOCIAL_DATE=$(TZ=America/Toronto date +%F)" >> "$GITHUB_ENV"
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Make today's post
        id: post
        env:
          SOCIAL_OUT: ${{ runner.temp }}/q
          SOCIAL_USED: ${{ runner.temp }}/q/used.json
          SOCIAL_TYPE: ${{ inputs.type }}
        run: node build/social.mjs
      - name: Save the queue
        env:
          SOCIAL_OUT: ${{ runner.temp }}/q
        run: |
          node build/social-queue.mjs
          cd "$RUNNER_TEMP/q"
          git init -q -b social-queue
          git add -A
          git -c user.name=formline-bot -c user.email=formline-bot@users.noreply.github.com commit -qm "Social posts to $SOCIAL_DATE"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" social-queue
      - name: Open the review issue
        env:
          TITLE: ${{ steps.post.outputs.title }}
        run: |
          gh label create social-post --color F6B638 --description "Daily social post" 2>/dev/null || true
          gh label create posted --color 5FCF8A --description "Posted to Instagram" 2>/dev/null || true
          # a re-run for the same day replaces that day's issue
          for n in $(gh issue list --label social-post --state open --search "Post for $SOCIAL_DATE in:title" --json number -q '.[].number'); do gh issue close "$n" -c "Replaced by a new version."; done
          gh issue create --title "Post for $SOCIAL_DATE: $TITLE" --label social-post --body-file "$RUNNER_TEMP/q/issue.md"

  publish:
    if: (github.event_name == 'schedule' && github.event.schedule == '7 23 * * *') || (github.event_name == 'workflow_dispatch' && inputs.step == 'publish')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      HAS_ADMIN: ${{ secrets.FORMLINE_ADMIN_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: build
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Post to Bluesky and Instagram
        run: |
          export SOCIAL_DATE=$(TZ=America/Toronto date +%F)
          node build/social-publish.mjs
      - name: Keep the Instagram token fresh (Sundays)
        if: env.HAS_ADMIN == 'true' && env.IG_TOKEN != ''
        env:
          ADMIN: ${{ secrets.FORMLINE_ADMIN_TOKEN }}
        run: |
          [ "$(TZ=America/Toronto date +%u)" = 7 ] || { echo "Not Sunday."; exit 0; }
          TOKEN_OUT="$RUNNER_TEMP/t" node build/social-publish.mjs --refresh
          GH_TOKEN="$ADMIN" gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/t"
          rm -f "$RUNNER_TEMP/t"
