name: Daily social post
# Morning: make today's post (build/social.mjs), keep it on the social-queue branch, and open a review issue with the
# Instagram slides, the caption and an X version to post by hand. On international-window days two more posts are made
# at the same time, each with its own review issue: the results roundup of the day before (SOCIAL_SLOT=c) and a second
# post, usually another match preview (SOCIAL_SLOT=b). Later: post each one to Bluesky and Instagram unless its issue
# was closed (build/social-publish.mjs). Times are UTC: 10:27 is 5:27 am in Toronto in winter, 12:07 is 7:07 am
# (results), 14:07 is 9:07 am (the day's post; today's matches on window days) and 23:07 is 6:07 pm (evening post); an
# hour later in summer. 20:07 (3:07 pm, the results' old time) stays as a second try: it does nothing once they are out.
on:
  schedule:
    - cron: '27 10 * * *'
    - cron: '7 12 * * *'
    - cron: '7 14 * * *'
    - cron: '7 20 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:
    inputs:
      step:
        description: 'prepare = make the post(s) and open the issue(s); publish = post the morning one now; publish-results = post the results roundup now; publish-evening = post the evening one now'
        type: choice
        options: [prepare, publish, publish-results, publish-evening]
        default: prepare
      type:
        description: 'Kind of morning post (blank = the usual for the day): match, spotlight, onThisDay, rivalry, tournament, pastTournament, rankings, today'
        required: false
        default: ''
permissions:
  contents: write
  issues: write
concurrency: social

jobs:
  prepare:
    if: (github.event_name == 'schedule' && github.event.schedule == '27 10 * * *') || (github.event_name == 'workflow_dispatch' && inputs.step == 'prepare')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch the post queue
        run: |
          mkdir -p "$RUNNER_TEMP/q"
          if git fetch -q --depth=1 origin social-queue; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/q"; else echo "No queue yet."; fi
          echo "SOCIAL_DATE=$(TZ=America/Toronto date +%F)" >> "$GITHUB_ENV"
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Make today's post
        id: post
        env:
          SOCIAL_OUT: ${{ runner.temp }}/q
          SOCIAL_USED: ${{ runner.temp }}/q/used.json
          SOCIAL_TYPE: ${{ inputs.type }}
        run: node build/social.mjs
      - name: Add it to the queue
        env:
          SOCIAL_OUT: ${{ runner.temp }}/q
        run: node build/social-queue.mjs
      - name: Make the results roundup (international windows only)
        id: post3
        env:
          SOCIAL_OUT: ${{ runner.temp }}/q
          SOCIAL_USED: ${{ runner.temp }}/q/used.json
          SOCIAL_SLOT: c
        run: node build/social.mjs
      - name: Add the results roundup to the queue
        if: steps.post3.outputs.title != ''
        env:
          SOCIAL_OUT: ${{ runner.temp }}/q
          SOCIAL_SLOT: c
        run: node build/social-queue.mjs
      - name: Make the evening post (international windows only)
        id: post2
        env:
          SOCIAL_OUT: ${{ runner.temp }}/q
          SOCIAL_USED: ${{ runner.temp }}/q/used.json
          SOCIAL_SLOT: b
        run: node build/social.mjs
      - name: Add the evening post to the queue
        if: steps.post2.outputs.title != ''
        env:
          SOCIAL_OUT: ${{ runner.temp }}/q
          SOCIAL_SLOT: b
        run: node build/social-queue.mjs
      - name: Save the queue
        run: |
          cd "$RUNNER_TEMP/q"
          git init -q -b social-queue
          git add -A
          git -c user.name=formline-bot -c user.email=formline-bot@users.noreply.github.com commit -qm "Social posts to $SOCIAL_DATE"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" social-queue
      - name: Open the review issues
        env:
          TITLE: ${{ steps.post.outputs.title }}
          TITLE2: ${{ steps.post2.outputs.title }}
          TITLE3: ${{ steps.post3.outputs.title }}
        run: |
          gh label create social-post --color F6B638 --description "Daily social post" 2>/dev/null || true
          gh label create posted --color 5FCF8A --description "Posted to Instagram" 2>/dev/null || true
          # a re-run for the same day replaces that day's issues
          for n in $(gh issue list --label social-post --state open --json number,title -q ".[] | select(.title | startswith(\"Post for $SOCIAL_DATE\")) | .number"); do gh issue close "$n" -c "Replaced by a new version."; done
          gh issue create --title "Post for $SOCIAL_DATE: $TITLE" --label social-post --body-file "$RUNNER_TEMP/q/issue.md"
          if [ -n "$TITLE3" ]; then gh issue create --title "Post for $SOCIAL_DATE (results): $TITLE3" --label social-post --body-file "$RUNNER_TEMP/q/issue-c.md"; fi
          if [ -n "$TITLE2" ]; then gh issue create --title "Post for $SOCIAL_DATE (evening): $TITLE2" --label social-post --body-file "$RUNNER_TEMP/q/issue-b.md"; fi

  publish:
    if: (github.event_name == 'schedule' && (github.event.schedule == '7 14 * * *' || github.event.schedule == '7 12 * * *' || github.event.schedule == '7 20 * * *' || github.event.schedule == '7 23 * * *')) || (github.event_name == 'workflow_dispatch' && (inputs.step == 'publish' || inputs.step == 'publish-results' || inputs.step == 'publish-evening'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      HAS_ADMIN: ${{ secrets.FORMLINE_ADMIN_TOKEN != '' }}
      SOCIAL_SLOT: ${{ (github.event.schedule == '7 12 * * *' || github.event.schedule == '7 20 * * *' || inputs.step == 'publish-results') && 'c' || (github.event.schedule == '7 23 * * *' || inputs.step == 'publish-evening') && 'b' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: build
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Post to Bluesky and Instagram
        run: |
          export SOCIAL_DATE=$(TZ=America/Toronto date +%F)
          node build/social-publish.mjs
      - name: Keep the Instagram token fresh (Sundays)
        if: env.HAS_ADMIN == 'true' && env.IG_TOKEN != '' && env.SOCIAL_SLOT == ''
        env:
          ADMIN: ${{ secrets.FORMLINE_ADMIN_TOKEN }}
        run: |
          [ "$(TZ=America/Toronto date +%u)" = 7 ] || { echo "Not Sunday."; exit 0; }
          TOKEN_OUT="$RUNNER_TEMP/t" node build/social-publish.mjs --refresh
          GH_TOKEN="$ADMIN" gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/t"
          rm -f "$RUNNER_TEMP/t"

